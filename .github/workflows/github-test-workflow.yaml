on:
  workflow_call:
    inputs:
      actionlint_flags:
        description: The branch to run this on
        type: string
        required: false
        default: ''
  
jobs:
    reviewdog:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pull-requests: write
      steps:
        - uses: actions/checkout@v4
        - uses: reviewdog/action-actionlint@v1
          with:
            reporter: github-pr-review
            fail_on_error: true
            actionlint_flags: ${{ inputs.actionlint_flags }}
